<!DOCTYPE html>
    <head>
        <title>Texture Presentation-Time Demo (v4)</title>
        <!-- Load in the jspsych tools, plugins, and layout -->
  <script src="https://unpkg.com/jspsych@7.3.4" type="text/javascript"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
  <script src = "scripts/trials.js" type="text/javascript"></script>
  <link href= "scripts/match_mosaic.css" rel="stylesheet" type="text/css" id = "Main" ></link>

    <style>
    .demo-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #222;
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      padding: 6px 12px;
      text-align: center;
      z-index: 9999;
    }
    </style>
    </head>
    <body>
    <div class="demo-banner">v4 presentation-time DEMO &mdash; not a real data-collection build. Study image hides after the listed time; choices stay up and wait for a response.</div>
    </body>

<script>

<!---------------------  CODE STARTS HERE ------------------------------------------->

// Track completion status and exit reason
let completionStatus = {
  finished: false,
  exitReason: 'unknown',
  exitTime: null,
  totalTrialsCompleted: 0
};

// Track fullscreen requirement
var should_be_in_fullscreen = false;

var jsPsych = initJsPsych({
  on_interaction_data_update: function(data) {
    if (data.event == 'fullscreenexit' && should_be_in_fullscreen) {
      jsPsych.getDisplayElement().style.visibility = 'hidden';
      jsPsych.getDisplayElement().insertAdjacentHTML(
        'beforebegin',
        `<div id="message-div" style="margin:auto; width:100%; text-align:center;
          position:absolute; top:200px;">
          <b>Please remain in fullscreen mode during the demo.</b>
          <p>When you click the button below, you will enter fullscreen mode.</p>
          <button id="jspsych-fullscreen-btn" class="jspsych-btn">Continue</button>
        </div>`
      );
      document.querySelector('#jspsych-fullscreen-btn').addEventListener('click', function() {
        var element = document.documentElement;
        if (element.requestFullscreen) element.requestFullscreen();
        else if (element.mozRequestFullScreen) element.mozRequestFullScreen();
        else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
        else if (element.msRequestFullscreen) element.msRequestFullscreen();
      });
    }
    if (data.event == 'fullscreenenter') {
      var msg_div = document.querySelector('#message-div');
      if (msg_div !== null) {
        msg_div.remove();
        jsPsych.getDisplayElement().style.visibility = 'visible';
      }
    }
  },
  on_finish: function () {}
});

let sbjID = jsPsych.data.getURLVariable('id');
if (sbjID === undefined) {
  sbjID = jsPsych.randomization.randomID(10);
}

jsPsych.data.addProperties({
  sbjID: sbjID,
  DemoBuild: 'v4_presentation_time_092726'
});

// Timeline
var timeline = [];

timeline.push({
  type: jsPsychFullscreen,
  message: `<p>Welcome to the presentation-time demo!</p>
  <p>This shows how the study image will hide after a set time on the easy trials, while
  the answer choices stay up and wait for your click.</p>`,
  fullscreen_mode: true,
  on_start: function() {
    should_be_in_fullscreen = true;
  }
});

let images = [];
for (let trial of trials) {
  for (let choice of trial.choices) {
    images.push(`stimuli/${choice}`);
  }
  images.push(`stimuli/${trial.study}`);
}

timeline.push({
  type: jsPsychPreload,
  message: `<b>Please Wait...Content is Loading.</b><br>This may take a few seconds.`,
  auto_preload: false,
  images: images,
  continue_after_error: true
});

for (let trial of trials) {
  const choiceHTML = trial.choices.map(choice =>
    `<div class="sf-cell"><img src="stimuli/${choice}" draggable="false" height="200px" ondragstart="return false;left:0;"></div>
`
  );

  // Position of each choice / the empty slot is randomized fresh per participant per trial,
  // same convention as the main texture engine -- not stored in trials.js.
  const shuffledPositions = jsPsych.randomization.shuffle(['top', 'left', 'right', 'bottom']);
  const slots = shuffledPositions.slice(0, trial.choices.length);
  const emptySlot = shuffledPositions[trial.choices.length];

  // Phase 1: study ALONE, visible for this trial's presentation time (the varied X).
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    prompt: `<p style = "position: relative; text-align: center; left: 235px; top: -150px; font-size: 25px;"><b>Trial ${trial.trial}/${trials.length} &mdash; study visible for ${trial.presentationTime}ms</b>`,
    stimulus: `
    <div class="sf-cell"><img src="stimuli/${trial.study}" draggable="false" height="200px" ondragstart="return false;"></div>
    <div class="sf-prompt">which texture matches the center?</div>`,
    choices: "NO_KEYS",
    css_classes: ['sf-panel-trial'],
    trial_duration: trial.presentationTime,
    post_trial_gap: 0,
    data: {
      SbjID: sbjID,
      TrialNum: trial.trial,
      CorrRes: trial.corrRes,
      TrialType: trial.trialType,
      Category: trial.category,
      PresentationTimeMs: trial.presentationTime,
      SourcePilot: trial.sourcePilot,
      SourceOrigTrial: trial.sourceOrigTrial,
      PilotAccuracy: trial.pilotAccuracy,
      PilotItemRest: trial.pilotItemRest
    },
  });

  // Phase 2: study disappears, choices appear. Unlimited time to respond.
  timeline.push({
    type: jsPsychHtmlButtonResponse,
    prompt: `<p style = "position: relative; text-align: center; left: 235px; top: -150px; font-size: 25px;"><b>Trial ${trial.trial}/${trials.length} &mdash; study visible for ${trial.presentationTime}ms</b>`,
    stimulus: `
    <div class="sf-prompt">which texture matches the center?</div>`,
    choices: choiceHTML,
    button_html: '<button class="jspsych-btn sf-btn">%choice%</button>',
    css_classes: ['sf-panel-trial'],
    response_ends_trial: true,
    post_trial_gap: 500,
    on_load: function () {
      // drop each choice into its randomized slot (study cell is gone, so this grid
      // is choices-only, same positions as computed above)
      const wraps = document.querySelectorAll(
        '#jspsych-html-button-response-btngroup .jspsych-html-button-response-button');
      slots.forEach((pos, i) => { if (wraps[i]) wraps[i].classList.add('pos-' + pos); });
    },
    data: {
      SbjID: sbjID,
      TrialNum: trial.trial,
      CorrRes: trial.corrRes,
      TrialType: trial.trialType,
      Category: trial.category,
      Db: trial.db,
      Crossed: trial.crossed,
      ChoiceDb: trial.choice_db,
      ChoiceCategory: trial.choice_category,
      AnswerPart: trial.answer_part,
      PresentationTimeMs: trial.presentationTime,
      SourcePilot: trial.sourcePilot,
      SourceOrigTrial: trial.sourceOrigTrial,
      PilotAccuracy: trial.pilotAccuracy,
      PilotItemRest: trial.pilotItemRest,
      emptySlot: emptySlot,
      correctSlot: slots[trial.corrRes]
    },
    on_finish: function (data) {
      data.Correct = data.CorrRes == data.response;
      data.responseSlot = slots[data.response];
    },
  });
}

timeline.push({
  type: jsPsychCallFunction,
  func: () => {
    completionStatus.finished = true;
    completionStatus.exitReason = 'completed_normally';
    completionStatus.exitTime = new Date().toISOString();
    jsPsych.data.addProperties(completionStatus);
  }
});

timeline.push({
  type: jsPsychFullscreen,
  fullscreen_mode: false,
  on_start: function() {
    should_be_in_fullscreen = false;
  }
});

timeline.push({
  type: jsPsychHtmlButtonResponse,
  choices: ['Finish demo'],
  stimulus: function () {
    const test = jsPsych.data.get().filter({ trial_type: 'html-button-response' });
    const nTotal = test.count();
    const nCorrect = test.filter({ Correct: true }).count();
    const pct = nTotal ? Math.round(100 * nCorrect / nTotal) : 0;
    return `<p>Demo complete. <b>${nCorrect} / ${nTotal}</b> correct (<b>${pct}%</b>).</p>
    <p style="font-size:14px;color:#666;">Open the browser console and run <code>jsPsych.data.get().csv()</code>
    (or check Data Explorer) to see the per-trial PresentationTimeMs / Correct / responseSlot columns.</p>`;
  }
});

jsPsych.run(timeline);
    </script>
</html>
