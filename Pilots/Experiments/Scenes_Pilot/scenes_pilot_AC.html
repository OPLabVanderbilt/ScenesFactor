
<!DOCTYPE html>
<html>

    <title>Experiment</title>
    <script src="jspsych/plugin-fullscreen.js"></script>
    <script src="jspsych/plugin-preload.js"></script>
    <script src="jspsych/plugin-image-keyboard-response.js"></script>
    <script src="jspsych/plugin-image-button-response.js"></script>
    
    
    <style></style>
</head>
<body></body>

<script>

var timeline = [];

//ITI = Inter trial interval
//The ITI defines the time in between trials (in milliseconds)
ITI = 500;

// let chainLink = '';
// let maxAttentionFails = 999;
// let doAttentionCheck = true;
// let knockedOut = false;

var jsPsych = initJsPsych({
  on_finish: function () {
    // Always save completion data
    jsPsych.data.addProperties(completionStatus);
    
    // Only redirect if they finished properly
    if (completionStatus.finished && chainLink && !knockedOut) {
      window.location = chainLink;
    }
  }
});

let study = jsPsych.data.getURLVariable('study');
if (study === undefined) {
  study = 'unknown';
}

let sbjID = jsPsych.data.getURLVariable('id');
if (sbjID === undefined) {
  sbjID = jsPsych.randomization.randomID(10);
}

let attentionFails = Number(jsPsych.data.getURLVariable('num'));
if (isNaN(attentionFails)) {
  attentionFails = 0;
}

let source = jsPsych.data.getURLVariable('src');
if (source === undefined) {
  source = 'unknown';
}

jsPsych.data.addProperties({
  sbjID: sbjID,
  Source: source,
  Study: study
});

//PRELOAD STIMULI HERE:
var preload = {
  type: preload,
  auto_preload: true
}

//INSERT TRIAL HERE TO PUT EXPERIMENT IN FULL SCREEN MODE

  var welcome_trial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: 'Welcome to our experiment! Please press the spacebar to fill out the demographic survey.',
    post_trial_gap: 500
} 
timeline.push(welcome_trial)

//


jsPsych.run(timeline);
</script>
</html>
